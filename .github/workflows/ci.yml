# Verificacao continua minima.
#
# Roda exatamente a mesma sequencia que `npm run verify` executa na maquina
# do desenvolvedor, para que uma falha aqui seja reproduzivel localmente sem
# adivinhacao.
#
# Esta afirmacao ja foi falsa. Ate 05/09/2026 o CI tinha um passo a mais —
# `npm run fixtures:pdf` — que o `verify` nao tinha, e sem ele a suite de
# navegador reprova 12 testes por ausencia de arquivo. No checkout principal
# as fixtures sobravam de execucoes anteriores e ninguem percebia; um worktree
# limpo nao herda arquivo ignorado, e o defeito aparece na primeira fatia feita
# em branch propria. A geracao virou `pretest:e2e` no package.json, que o npm
# dispara antes de `test:e2e` venha ele do `verify` ou de uma chamada direta.
# Se um passo voltar a existir so aqui, o comentario acima volta a mentir —
# acrescente ao `verify`, nao ao workflow.
#
# Deliberadamente FORA desta etapa: Supabase, migrations e qualquer teste que
# dependa de infraestrutura externa. O teste de stack limpa e o PR-10 do WP0 e
# entra quando houver `supabase start` no pipeline. A suite de navegador entra
# aqui porque tambem e hermetica: ela sobe o proprio servidor sem banco.
name: CI

# So em pull request — medido, nao suposto.
#
# Em setembro de 2026 o CI consumiu 2.034 minutos e estourou a franquia de
# 2.000 da conta gratuita (o repositorio e privado; em publico Actions e
# ilimitado). Dos 2.034, **955 foram execucoes de push na main**: 92 execucoes
# de pull request custaram 1.079 minutos, e 105 de push custaram 955.
#
# Essas 955 eram repeticao. O CI de um PR roda `refs/pull/N/merge`, que e a
# branch JA COMBINADA com a main atual — o resultado do merge, nao a branch
# isolada. Quando o merge acontece, a main fica identica ao que acabou de
# passar, e a execucao de push refazia os mesmos 14 minutos para confirmar o
# que ja se sabia.
#
# O que se perde, e como fica coberto: se dois PRs sao aprovados contra a
# mesma main e mesclados em seguida, o segundo entra sem ter sido testado
# contra o primeiro. A cobertura e de processo, e ja era a pratica —
# **antes de mesclar, a main entra na branch e o CI roda de novo** (foi o que
# aconteceu com o #37 em 15/09). Se isso for esquecido alguma vez, o defeito
# aparece no PR seguinte, e nao em producao: o deploy da Vercel tem o proprio
# gate.
#
# Se um dia a main puder receber commit direto, esta decisao precisa voltar a
# ser discutida — hoje o AGENTS.md proibe, e toda mudanca passa por PR.
on:
  pull_request:

# Sem segredos e sem escrita: o pipeline so precisa ler o repositorio.
permissions:
  contents: read

# Uma execucao por referencia. Push novo cancela a anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, testes, build e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` falha se package-lock.json divergir de package.json, o que e
      # a garantia de instalacao reproduzivel.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # As tres suites locais. Todas hermeticas: nenhuma abre rede ou banco.
      - name: Testes
        run: npm run test:ci

      # O build tambem exerce a trava de BRENNIMARK_DEV_SKIP_AUTH em producao.
      - name: Build de producao
        run: npm run build
        env:
          NODE_ENV: production

      # Tres motores. O leitor de PDF e o ponto do produto onde eles mais
      # divergem — worker, import.meta, criptografia, crypto.subtle — e um
      # manual que abre no Chrome e falha no Safari e um manual que nao abre
      # para metade dos designers. So a suite do importador roda nos tres; o
      # resto e HTML e CSS comuns.
      - name: Navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit firefox

      # Sobe `next dev` com BRENNIMARK_DEV_SKIP_AUTH e nada mais: sem Supabase,
      # sem segredo, sem rede. Ver playwright.config.ts.
      - name: Testes de navegador
        run: npm run test:e2e

      # Rastro, imagem e video so existem quando algo falhou; execucao verde
      # nao publica artefato nenhum.
      - name: Artefatos da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: e2e/.artefatos/
          retention-days: 7
          if-no-files-found: ignore
