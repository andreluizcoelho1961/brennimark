# Verificacao continua minima.
#
# Roda exatamente a mesma sequencia que `npm run verify` executa na maquina
# do desenvolvedor, para que uma falha aqui seja reproduzivel localmente sem
# adivinhacao.
#
# Deliberadamente FORA desta etapa: Supabase, migrations e qualquer teste que
# dependa de infraestrutura externa. O teste de stack limpa e o PR-10 do WP0 e
# entra quando houver `supabase start` no pipeline. A suite de navegador entra
# aqui porque tambem e hermetica: ela sobe o proprio servidor sem banco.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sem segredos e sem escrita: o pipeline so precisa ler o repositorio.
permissions:
  contents: read

# Uma execucao por referencia. Push novo cancela a anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, testes, build e navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` falha se package-lock.json divergir de package.json, o que e
      # a garantia de instalacao reproduzivel.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # As tres suites locais. Todas hermeticas: nenhuma abre rede ou banco.
      - name: Testes
        run: npm run test:ci

      # O build tambem exerce a trava de BRANDVILLE_DEV_SKIP_AUTH em producao.
      - name: Build de producao
        run: npm run build
        env:
          NODE_ENV: production

      # Tres motores. O leitor de PDF e o ponto do produto onde eles mais
      # divergem — worker, import.meta, criptografia, crypto.subtle — e um
      # manual que abre no Chrome e falha no Safari e um manual que nao abre
      # para metade dos designers. So a suite do importador roda nos tres; o
      # resto e HTML e CSS comuns.
      - name: Navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit firefox

      # As fixtures grandes ficam fora do git: mil paginas de texto nao se
      # versionam, e o gerador as reconstroi identicas.
      - name: Fixtures de PDF
        run: npm run fixtures:pdf

      # Sobe `next dev` com BRANDVILLE_DEV_SKIP_AUTH e nada mais: sem Supabase,
      # sem segredo, sem rede. Ver playwright.config.ts.
      - name: Testes de navegador
        run: npm run test:e2e

      # Rastro, imagem e video so existem quando algo falhou; execucao verde
      # nao publica artefato nenhum.
      - name: Artefatos da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: e2e/.artefatos/
          retention-days: 7
          if-no-files-found: ignore
